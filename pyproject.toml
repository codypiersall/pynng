[project]
name = "pynng"
authors = [{ name = "Cody Piersall", email = "cody.piersall@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: Trio",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    # Python 3.10 reached EOL in Oct 2026; support is deprecated and will be removed in a future release
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
]
dependencies = ["cffi>=1.15.0", "sniffio>=1.3.0"]
description = "Networking made simply using nng"
license = "MIT"
license-files = ["LICENSE.txt", "LICENSES_THIRD_PARTY.txt"]
dynamic = ["version"]
keywords = [
    "networking",
    "nng",
    "nanomsg",
    "zmq",
    "messaging",
    "message",
    "trio",
    "asyncio",
]
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0", "pytest-trio>=0.8.0", "trio>=0.22.0", "headerkit>=0.47.6; python_version >= '3.11'"]
docs = ["sphinx", "sphinx-rtd-theme", "sphinxcontrib-trio"]

[project.urls]
Homepage = "https://github.com/codypiersall/pynng"
Source = "https://github.com/codypiersall/pynng"
Documentation = "https://pynng.readthedocs.io/en/latest/"

[build-system]
build-backend = "scikit_build_core.build"
requires = [
    "scikit-build-core>=0.8.0",
    "cffi",
    "cffi_buildtool",
    "headerkit>=0.47.6; python_version >= '3.11'",
    "setuptools-scm",
]

[tool.setuptools]
packages = ["pynng"]

[tool.scikit-build]
wheel.packages = ["pynng"]
wheel.py-api = "cp310"
cmake.version = ">=3.26"
cmake.verbose = true
minimum-version = "0.8.0"
build-dir = "./build/{cache_tag}"
cmake.define = { "CMAKE_POSITION_INDEPENDENT_CODE" = "ON" }
cmake.build-type = "Release"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"



[tool.setuptools_scm]
version_file = "pynng/_version.py"

[tool.cibuildwheel]
build-frontend = "build[uv]"
enable = ["pypy"]
# Build cp312 (which produces the universal abi3 wheel for standard CPython)
# plus the free-threaded wheels (cp314t, cp315t) and PyPy 3.11 across all architectures.
build = "cp312-* cp314t-* cp315t-* pp311-*"
test-requires = ["pytest", "pytest-asyncio", "pytest-trio", "trio"]
# test_build.py tests the build system (header parsing via libclang), not the installed wheel.
# test_check_nng_updates.py tests repo maintenance scripts, not the installed wheel.
# Both run in smoketest/CI; cibuildwheel tests the installed wheel.
test-command = "pytest {project}/test --ignore={project}/test/test_build.py --ignore={project}/test/test_check_nng_updates.py"

# *-win32: 32-bit Python can't load 64-bit libclang during build
# *i686: 32-bit manylinux containers lack package managers for libclang
# cp*-macosx_arm64: CPython macOS wheels are already built as universal2
# pp*-win*: PyPy on Windows does not support building MSVC C-extensions
skip = "*-win32 *i686 cp*-macosx_arm64 pp*-win*"

build-verbosity = 1

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-build = "uv run --python 3.12 --no-project --with 'headerkit>=0.47.6' python -m headerkit.install_libclang --skip-verify"

[tool.cibuildwheel.windows]
# Windows builds fail because they try to use the same directory for different
# architectures, and that's no good.
before-build = "uv run --python 3.12 --no-project --with \"headerkit>=0.47.6\" python -m headerkit.install_libclang --skip-verify && python -c \"import shutil; shutil.rmtree('build', ignore_errors=True)\""
environment = { PATH = "C:\\Program Files\\LLVM\\bin;$PATH" }

[tool.cibuildwheel.macos]
# Build universal2 for CPython and native arm64 for PyPy (which lacks universal2 binaries)
archs = ["universal2", "arm64"]
test-skip = "*_universal2:x86_64"
before-build = "uv run --python 3.12 --no-project --with 'headerkit>=0.47.6' python -m headerkit.install_libclang --skip-verify"

environment = { CMAKE_OSX_ARCHITECTURES = "x86_64;arm64" }

[[tool.cibuildwheel.overrides]]
select = "pp*-macosx_*"
environment = { CMAKE_OSX_ARCHITECTURES = "arm64" }

[tool.pytest.ini_options]
addopts = "--capture=no --verbose"
testpaths = ["test"]
markers = [
    "nng_v1: marks tests as v1-only",
    "nng_v2: marks tests as v2-only (deselected when _nng_v2 is not built)",
    "requires_tls(*versions): marks tests that need TLS support in the named nng versions, or in the test's own version when none are named (skipped when built with PYNNG_TLS_ENGINE=none)",
]
