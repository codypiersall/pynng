name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - 'pynng/**'
      - 'build_pynng.py'
      - 'preprocess.py'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'stubs/**'
      - 'patches/**'
      - '.github/workflows/cibuildwheel.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'pynng/**'
      - 'build_pynng.py'
      - 'preprocess.py'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'stubs/**'
      - 'patches/**'
      - '.github/workflows/cibuildwheel.yml'
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    # Tier 2: Run on master push, release, manual dispatch, or when PR is labeled 'ci:full'
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full'))
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [
          ubuntu-24.04,
          ubuntu-24.04-arm,
          windows-11-arm,
          windows-2025,
          macos-15,
        ]
      # don't let one failing job cancel all the others.
      fail-fast: false

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # Used to host cibuildwheel
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  # create the source distribution
  make_sdist:
    # Tier 2: Run on master push, release, manual dispatch, or when PR is labeled 'ci:full'
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full'))
    name: Make SDist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Optional, use if you use setuptools_scm
          fetch-tags: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build SDist
        run: uv build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  # To enable PyPI publishing:
  # 1. On pypi.org: Add a "Trusted Publisher" for this repo
  #    - Owner: codypiersall
  #    - Repository: pynng
  #    - Workflow: cibuildwheel.yml
  #    - Environment: pypi
  # 2. On GitHub: Create an environment called "pypi" in repo Settings > Environments
  publish:
    name: Publish to PyPI
    needs: [build_wheels, make_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/p/pynng
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: cibw-*
          merge-multiple: true

      - name: Generate attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
