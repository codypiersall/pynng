# Check for new nng releases
#
# Runs daily to check for new nng versions.
# Creates a GitHub issue if a new version is found that we haven't tested against.
#
# Manual trigger:
#   Go to Actions -> check nng updates -> Run workflow

name: check nng updates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install packaging uv

      - name: Check for new nng releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_nng_updates.py

      - name: Test and open PR or issue for each track update
        if: steps.check.outputs.should_notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATES_JSON: ${{ steps.check.outputs.updates_json }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build libclang-dev python3-dev jq
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          base_sha="$(git rev-parse HEAD)"
          count="$(echo "$UPDATES_JSON" | jq 'length')"

          for i in $(seq 0 $((count - 1))); do
            track="$(echo "$UPDATES_JSON" | jq -r ".[$i].track")"
            target_var="$(echo "$UPDATES_JSON" | jq -r ".[$i].target_var")"
            current_rev="$(echo "$UPDATES_JSON" | jq -r ".[$i].current_rev")"
            latest_tag="$(echo "$UPDATES_JSON" | jq -r ".[$i].latest_tag")"
            is_patch="$(echo "$UPDATES_JSON" | jq -r ".[$i].is_patch")"
            fork_latest="$(echo "$UPDATES_JSON" | jq -r ".[$i].fork_latest_tag")"

            echo "=== Testing track $track ($target_var: $current_rev -> $latest_tag, is_patch=$is_patch) ==="
            git checkout -f "$base_sha"
            rm -rf /tmp/build-venv build
            uv venv /tmp/build-venv

            if [ "$target_var" = "NNG_V2_REV" ]; then
              sed -i "s|set(NNG_V2_REPO .*|set(NNG_V2_REPO \"https://github.com/nanomsg/nng\" CACHE STRING \"URL of the NNG v2 repository\")|" CMakeLists.txt
              sed -i "s|set(NNG_V2_REV .*|set(NNG_V2_REV \"$latest_tag\" CACHE STRING \"Revision of NNG v2 to use\")|" CMakeLists.txt
            else
              sed -i "s|set(NNG_REPO .*|set(NNG_REPO \"https://github.com/nanomsg/nng\" CACHE STRING \"URL of the NNG repository\")|" CMakeLists.txt
              sed -i "s|set(NNG_REV .*|set(NNG_REV \"$latest_tag\" CACHE STRING \"Revision of NNG to use\")|" CMakeLists.txt
            fi

            set +e
            set -o pipefail
            uv pip install --python /tmp/build-venv -v -e '.[dev]' 2>&1 | tail -50
            build_result=$?

            if [ $build_result -eq 0 ]; then
              build_status="success"
              /tmp/build-venv/bin/pytest -v test 2>&1 | tail -50
              test_result=$?
              if [ $test_result -eq 0 ]; then
                test_status="success"
              else
                test_status="failure"
              fi
            else
              build_status="failure"
              test_status="skipped"
            fi
            set -e

            pr_created="false"
            if [ "$build_status" = "success" ] && [ "$test_status" = "success" ]; then
              branch_name="chore/bump-nng-${latest_tag}"
              git checkout -B "$branch_name"
              git add CMakeLists.txt
              git commit -m "build(deps): bump ${target_var} from ${current_rev} to ${latest_tag}"
              if git push -u origin "$branch_name" --force; then
                pr_title="build(deps): bump ${target_var} from ${current_rev} to ${latest_tag}"
                pr_body=$(cat <<EOF
          Bumps \`${target_var}\` (NNG ${track} track) from \`${current_rev}\` to [\`${latest_tag}\`](https://github.com/nanomsg/nng/releases/tag/${latest_tag}).

          ## Verification
          - **Build:** ${build_status}
          - **Tests:** ${test_status}
          - **Patch update:** ${is_patch}
          - **Workflow run:** ${RUN_URL}
          EOF
                )
                if gh pr create --title "$pr_title" --body "$pr_body" --label "dependencies" --head "$branch_name"; then
                  pr_created="true"
                fi
              fi
            fi

            if [ "$pr_created" != "true" ]; then
              title="nng update available: $latest_tag"
              body=$(cat <<EOF
          A new nng version is available upstream.

          ## Version Info
          - **Track:** \`$track\` (\`$target_var\`)
          - **Current tracking (\`$target_var\`):** \`$current_rev\`
          - **Latest upstream tag:** \`$latest_tag\`
          - **Latest fork tag:** \`$fork_latest\`

          ## Build Test Results
          - **Build:** $build_status
          - **Tests:** $test_status

          ## Action Required
          1. Review [nng changelog](https://github.com/nanomsg/nng/releases/tag/$latest_tag)
          2. Update \`$target_var\` in \`CMakeLists.txt\`
          3. Run full test suite

          **Workflow run:** $RUN_URL
          EOF
              )
              gh issue create --title "$title" --body "$body" --label "dependencies"
            fi
          done
