name: sanitizers

on:
  workflow_dispatch:
  push:
    paths:
      - 'pynng/**'
      - 'src/**'
      - 'build_pynng.py'
      - 'test/**'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'patches/**'
      - 'scripts/ci/sanitizers.sh'
      - 'scripts/ci/ubsan.supp'
      - '.github/workflows/sanitizers.yml'
  pull_request:
    paths:
      - 'pynng/**'
      - 'src/**'
      - 'build_pynng.py'
      - 'test/**'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'patches/**'
      - 'scripts/ci/sanitizers.sh'
      - 'scripts/ci/ubsan.supp'
      - '.github/workflows/sanitizers.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # No same-repository pull_request filter, unlike smoketest: this job must
  # also run on pull requests between branches of one fork.
  asan-ubsan:
    name: ASan + UBSan (Linux, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - run: sudo apt-get install -y --no-install-recommends ninja-build libclang-dev || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build libclang-dev)
      # ASan runtimes older than LLVM 18 / GCC 14 can fail to map shadow
      # memory with the 32-bit mmap randomisation of recent runner kernels.
      - name: Limit mmap randomisation for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Build with sanitizers and run tests
        env:
          CC: gcc
          SANITIZER_PYTHON: '3.12'
        run: scripts/ci/sanitizers.sh
      - name: Upload build log and sanitizer reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-logs
          path: |
            build/sanitizers/build.log
            build/sanitizers/reports/
          if-no-files-found: ignore
